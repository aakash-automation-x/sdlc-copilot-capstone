<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Portal — Vehicle Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a365d;
      color: #fff;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.02em; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    .search-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 480px;
    }

    .search-card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: #2d3748;
    }

    .search-row {
      display: flex;
      gap: 0.6rem;
    }

    input[type="number"] {
      flex: 1;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus { border-color: #3182ce; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    button {
      padding: 0.65rem 1.3rem;
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #2c5282; }
    button:disabled { background: #90cdf4; cursor: not-allowed; }

    .hint {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: #718096;
    }

    /* Result / error / loading */
    .result-area { margin-top: 2rem; width: 100%; max-width: 480px; }

    .spinner {
      display: flex;
      justify-content: center;
      padding: 2rem 0;
    }
    .spinner::after {
      content: "";
      width: 36px;
      height: 36px;
      border: 4px solid #bee3f8;
      border-top-color: #2b6cb0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fff5f5;
      border: 1px solid #fc8181;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      color: #c53030;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .vehicle-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .vehicle-card-header {
      background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
      color: #fff;
      padding: 1.1rem 1.5rem;
    }
    .vehicle-card-header .vehicle-id {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.75;
      margin-bottom: 0.2rem;
    }
    .vehicle-card-header .vehicle-name {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .attributes {
      padding: 0.5rem 0;
    }
    .attribute-row {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #edf2f7;
      gap: 1rem;
    }
    .attribute-row:last-child { border-bottom: none; }
    .attr-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #ebf8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }
    .attr-label {
      font-size: 0.78rem;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .attr-value {
      font-size: 0.98rem;
      font-weight: 600;
      color: #2d3748;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="3" width="15" height="13" rx="2"/>
    <path d="M16 8h5l3 5v3h-8V8z"/>
    <circle cx="5.5" cy="18.5" r="2.5"/>
    <circle cx="18.5" cy="18.5" r="2.5"/>
  </svg>
  <h1>Car Portal</h1>
</header>

<main>
  <div class="search-card">
    <h2>Vehicle Lookup</h2>
    <div class="search-row">
      <input type="number" id="vehicleId" placeholder="Enter Vehicle ID" min="1" />
      <button id="searchBtn" onclick="searchVehicle()">Search</button>
    </div>
    <p class="hint">Try IDs 1 – 10</p>
  </div>

  <div class="result-area">
    <div id="spinner" class="spinner" hidden></div>
    <div id="errorMsg" class="error-msg" hidden></div>
    <div id="vehicleCard" class="vehicle-card" hidden>
      <div class="vehicle-card-header">
        <div class="vehicle-id" id="cardId"></div>
        <div class="vehicle-name" id="cardName"></div>
      </div>
      <div class="attributes">
        <div class="attribute-row">
          <div class="attr-icon">🏭</div>
          <div>
            <div class="attr-label">Make</div>
            <div class="attr-value" id="attrMake"></div>
          </div>
        </div>
        <div class="attribute-row">
          <div class="attr-icon">🚗</div>
          <div>
            <div class="attr-label">Model</div>
            <div class="attr-value" id="attrModel"></div>
          </div>
        </div>
        <div class="attribute-row">
          <div class="attr-icon">📅</div>
          <div>
            <div class="attr-label">Year</div>
            <div class="attr-value" id="attrYear"></div>
          </div>
        </div>
        <div class="attribute-row">
          <div class="attr-icon">⛽</div>
          <div>
            <div class="attr-label">Fuel Type</div>
            <div class="attr-value" id="attrFuel"></div>
          </div>
        </div>
        <div class="attribute-row">
          <div class="attr-icon">⚙️</div>
          <div>
            <div class="attr-label">Transmission</div>
            <div class="attr-value" id="attrTransmission"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const input = document.getElementById('vehicleId');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') searchVehicle();
  });

  function setVisible(id, show) {
    document.getElementById(id).hidden = !show;
  }

  async function searchVehicle() {
    const id = input.value.trim();
    if (!id || isNaN(id) || parseInt(id) < 1) {
      showError('Please enter a valid Vehicle ID (e.g. 1, 2, 3...)');
      return;
    }

    setVisible('spinner', true);
    setVisible('errorMsg', false);
    setVisible('vehicleCard', false);
    document.getElementById('searchBtn').disabled = true;

    try {
      const res = await fetch(`/vehicles/${parseInt(id)}`);

      if (res.status === 404) {
        showError(`No vehicle found with ID ${id}. Try IDs 1–10.`);
        return;
      }
      if (!res.ok) {
        showError(`Server error (${res.status}). Please try again.`);
        return;
      }

      const v = await res.json();
      renderVehicle(parseInt(id), v);
    } catch (err) {
      showError('Could not connect to the server. Is the backend running?');
    } finally {
      setVisible('spinner', false);
      document.getElementById('searchBtn').disabled = false;
    }
  }

  function renderVehicle(id, v) {
    document.getElementById('cardId').textContent = `Vehicle ID: ${id}`;
    document.getElementById('cardName').textContent = `${v.make} ${v.model}`;
    document.getElementById('attrMake').textContent = v.make;
    document.getElementById('attrModel').textContent = v.model;
    document.getElementById('attrYear').textContent = v.year;
    document.getElementById('attrFuel').textContent = v.fuel_type;
    document.getElementById('attrTransmission').textContent = v.transmission;
    setVisible('vehicleCard', true);
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.innerHTML = `<span>⚠️</span> ${msg}`;
    setVisible('errorMsg', true);
  }
</script>

</body>
</html>
